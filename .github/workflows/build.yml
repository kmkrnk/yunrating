name: Пересчёт рейтинга
on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/merge.py
      # готовый сайт кладём в ветку gh-pages (из неё его и показывает GitHub Pages)
      - name: Публикация в gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898169+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Рейтинг на $(TZ=Europe/Minsk date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
